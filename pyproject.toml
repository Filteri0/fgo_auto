[project]
name = "fgo-auto"
version = "0.1.0"
description = "FGO（台服）自動周回工具：MuMu 模擬器、自動吃蘋果、選助戰、戰鬥腳本"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
    "pyside6>=6.12.0",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
