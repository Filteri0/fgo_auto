name = "摩根"

[farm]
runs = 0            # 0 = 無限
apples = ["gold"]   # 可以吃的果實與順序；聖晶石永遠不會吃
max_apples = 10

[support]   # 空字串 / 0 = 不限
player = ""        # 玩家名稱（OCR 比對，容許讀錯一個字）
servant = "摩根"       # 從者名稱
min_level = 120          # 從者等級至少
min_np = 5             # 寶具等級至少
ce = "support_ce.png"            # 禮裝圖（同資料夾），空字串 = 不限
mlb = true              # 禮裝要滿破
class_tab = "berserker"   # 職階頁籤，空字串 = 不切換
max_refresh = 20

[battle]
card_priority = "BAQ"
fallback_np = true
party = ["迪媽", "摩根", "摩根(助戰)"]   # 1~3 號位的名字（只用來顯示）

[battle.waves]   # s2-1 = 2號位技能1；s2-3>1 = 目標1號位；m1 = 御主技能1；np2 = 2號位寶具
1 = ["s2-1", "s2-2>2", "s2-3", "s1-3", "m1", "np2"]
2 = ["s3-1", "s3-2>3", "s3-3", "np3"]
3 = ["s1-1", "s1-2", "s1-3", "np1"]
