# 戰鬥腳本
# 隊伍位置：1 迪亞馬特、2 我的摩根、3 助戰摩根（VOYOV）
#
# 動作格式：
#   s2-1     2 號位的技能 1
#   s2-3>1   2 號位的技能 3，目標給 1 號位（沒寫目標時，跳出選目標就給「這一波要開寶具的人」）
#   m1       御主技能 1
#   np2      2 號位放寶具（要寫在技能後面）
#
# 腳本跑完如果還在同一波（寶具沒打死），之後的回合：不開技能，NP 滿就放寶具，其餘照卡色硬打。

card_priority = "BAQ"   # 普通卡優先順序：Buster > Arts > Quick
fallback_np = true      # 補刀回合 NP 滿就放寶具

[waves]
1 = ["s2-1", "s1-3", "m1", "np2"]   # 我的摩根技能1、迪亞馬特技能3、御主技能1 → 我的摩根寶具
2 = ["s3-1", "s3-3", "s2-3", "np3"] # 助戰摩根技能1、3、我的摩根技能3 → 助戰摩根寶具
3 = ["s1-1", "s1-2", "s1-3", "np1"] # 迪亞馬特技能1、2、3 → 迪亞馬特寶具
